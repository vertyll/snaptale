name: snaptale

services:
  mysql:
    image: docker.io/library/mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: snaptale
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  maildev:
    image: docker.io/maildev/maildev:3.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"

  backend:
    profiles: [app]
    build:
      context: backend
    depends_on:
      mysql:
        condition: service_healthy
      maildev:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/snaptale
      SPRING_MAIL_HOST: maildev
      SNAPTALE_MEDIA_DIRECTORY: /var/app/media
    volumes:
      - media:/var/app/media
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    profiles: [app]
    build:
      context: frontend
    depends_on:
      - backend
    environment:
      NUXT_BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mysql-data:
  media:
