name: snaptale

services:
  mysql:
    image: docker.io/library/mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: snaptale
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  maildev:
    image: docker.io/maildev/maildev:3.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1080/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:9000
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:9000:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data/h2
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    profiles: [app]
    build:
      context: backend
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/snaptale
      SNAPTALE_KEYCLOAK_BACKCHANNEL_REALM_URL: http://keycloak:8080/realms/snaptale
      SNAPTALE_MEDIA_DIRECTORY: /var/app/media
    volumes:
      - media:/var/app/media
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    profiles: [app]
    build:
      context: frontend
    depends_on:
      - backend
    environment:
      NUXT_BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mysql-data:
  media:
  keycloak-data:
