name: Backend

on:
  push:
    branches: [main]
    tags: ["backend-v*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_image.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Spotless, Error Prone + NullAway, PMD, SpotBugs, tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/pmd-main/pmd.xml
            backend/target/pmd-test/pmd.xml
            backend/target/spotbugsXml.xml
          if-no-files-found: ignore

  image:
    needs: verify
    if: github.event_name != 'push' || github.ref_type == 'tag'
    uses: ./.github/workflows/_image.yml
    with:
      context: backend
      image-name: vertyll/snaptale-backend
      tag-prefix: backend-v
    secrets: inherit
