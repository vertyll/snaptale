name: Backend

on:
  push:
    branches: [main]
    tags: ["backend-v*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_image.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Lint
        run: ./mvnw -B -ntp verify -DskipTests

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-lint-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/pmd-main/pmd.xml
            backend/target/pmd-test/pmd.xml
            backend/target/spotbugsXml.xml
          if-no-files-found: ignore

  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true -Dpmd.skip=true -Dspotbugs.skip=true

      - name: Analyze
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./mvnw -B -ntp sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/pmd-main/pmd.xml
            backend/target/pmd-test/pmd.xml
            backend/target/spotbugsXml.xml
          if-no-files-found: ignore

  image:
    name: Image
    needs: [lint, test]
    if: github.event_name != 'push' || github.ref_type == 'tag'
    uses: ./.github/workflows/_image.yml
    with:
      context: backend
      image-name: vertyll/snaptale-backend
      tag-prefix: backend-v
    secrets: inherit
