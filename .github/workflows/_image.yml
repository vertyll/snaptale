name: Image (reusable)

on:
  workflow_call:
    inputs:
      context:
        description: Build context (repository directory)
        required: true
        type: string
      image-name:
        description: Image name in the registry
        required: true
        type: string
      tag-prefix:
        description: Git tag prefix that publishes the image (e.g. backend-v)
        required: true
        type: string
      build-args:
        description: Build arguments (KEY=value, one per line)
        required: false
        type: string
        default: ""
    secrets:
      ZOT_USERNAME:
        required: false
      ZOT_PASSWORD:
        required: false

permissions:
  contents: read

env:
  REGISTRY: zot.vertyll.dev

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Derive image version
        id: vars
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#"$TAG_PREFIX"}" >> "$GITHUB_OUTPUT"
          else
            echo "version=pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Zot
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          build-args: ${{ inputs.build-args }}
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.image-name }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ inputs.image-name }}:latest
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
