name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch markright
        env:
          VERSION: v0.2.2
          TARGET: x86_64-unknown-linux-musl
        run: |
          base="https://github.com/vertyll/markright/releases/download/$VERSION"
          curl -fsSLO "$base/markright-$TARGET.tar.gz"
          curl -fsSL "$base/SHA256SUMS" | grep " markright-$TARGET.tar.gz$" | sha256sum -c -
          tar -xzf "markright-$TARGET.tar.gz" markright

      - name: Check Markdown formatting, links, anchors, alerts and the index
        run: ./markright check
