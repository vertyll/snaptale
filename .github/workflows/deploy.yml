name: Build and Publish Snaptale

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: zot.vertyll.dev

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            image: vertyll/snaptale-backend
            context: ./backend
            cache-scope: backend
            build-args: ""

          - name: Frontend
            image: vertyll/snaptale-frontend
            context: ./frontend
            cache-scope: frontend
            build-args: |
              API_BASE_URL=https://api.snaptale.vertyll.dev
              FRONTEND_URL=https://snaptale.vertyll.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Derive image version
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "version=pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Zot
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          target: production
          build-args: ${{ matrix.build-args }}
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}