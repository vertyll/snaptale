spring.application.name=snaptale-backend
spring.threads.virtual.enabled=true
spring.main.banner-mode=off

server.port=8080
server.shutdown=graceful
server.tomcat.use-relative-redirects=true
server.servlet.session.timeout=14d
server.servlet.session.cookie.name=SNAPTALE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${snaptale.security.secure-cookies}

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true

spring.servlet.multipart.max-file-size=${snaptale.media.max-video-size}
spring.servlet.multipart.max-request-size=110MB

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

snaptale.media.max-video-size=100MB
snaptale.media.max-image-size=5MB
snaptale.media.avatar-size=512

snaptale.auth.mail-from-name=SnapTale
snaptale.auth.max-login-attempts=5
snaptale.auth.login-lockout=15m
