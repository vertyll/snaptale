spring.datasource.url=jdbc:mysql://localhost:3306/snaptale
spring.datasource.username=root
spring.datasource.password=root

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.mail.host=localhost
spring.mail.port=1025

# Plain HTTP: no Secure flag, and so no __Host- prefix, which requires it.
application.security.secure-cookies=false
server.servlet.session.cookie.name=SNAPTALE_SESSION
application.media.directory=media
application.security.frontend-url=http://localhost:3000
application.keycloak.realm-url=http://localhost:9000/realms/snaptale
application.keycloak.client-secret=snaptale-local-secret
application.mail.from=noreply@application.local

logging.level.com.vertyll.snaptale=DEBUG
