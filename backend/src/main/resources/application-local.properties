# Database
spring.datasource.url=jdbc:mysql://localhost:3306/snaptale
spring.datasource.username=root
spring.datasource.password=root

# Mail
spring.mail.host=localhost
spring.mail.port=1025

# Security, media and auth
snaptale.security.secure-cookies=false
snaptale.media.directory=media
snaptale.auth.frontend-url=http://localhost:3000
snaptale.auth.mail-from=noreply@snaptale.local

# Logging
logging.level.com.vertyll.snaptale=DEBUG
