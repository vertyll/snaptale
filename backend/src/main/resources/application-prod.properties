# Database with TLS verified against the internal CA truststore
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Security, media and auth
snaptale.security.secure-cookies=true
snaptale.media.directory=${MEDIA_DIRECTORY}
snaptale.auth.frontend-url=${FRONTEND_URL}
snaptale.auth.mail-from=${MAIL_FROM}

# Logging
logging.structured.format.console=ecs
